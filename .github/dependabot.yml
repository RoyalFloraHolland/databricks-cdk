# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/aws-lambda/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    directory: "/typescript/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

  # The uv image in aws-lambda/Dockerfile (tag + digest)
  - package-ecosystem: "docker"
    directory: "/aws-lambda/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "public.ecr.aws/lambda/python"

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
