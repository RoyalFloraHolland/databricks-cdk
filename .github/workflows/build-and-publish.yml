name: Build and Publish

on:
  workflow_dispatch: # Manual trigger only; the job below only runs on the main branch
    inputs:
      bump_level:
        type: choice
        description: Select bump level
        required: true
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}

env:
  IMAGE_NAME: databricks-cdk-lambda

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.CI_PAT }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install uv
        uses: ./.github/actions/setup-uv

      - name: Bump version
        id: version
        env:
          BUMP_LEVEL: ${{ inputs.bump_level }}
        run: |
          echo "bump level: ${BUMP_LEVEL}"

          cd typescript
          npm ci
          NEW_VERSION=$(npm version "${BUMP_LEVEL}" | sed "s/^v//")
          echo "new version: ${NEW_VERSION}"
          git config --local user.email "Bumpversion"
          git config --local user.name "Bumpversion"
          git add package.json package-lock.json
          npx tsc

          cd ../aws-lambda
          uv version --no-sync "${NEW_VERSION}"
          uv lock --upgrade
          git add pyproject.toml uv.lock

          git commit -m "Bump version to ${NEW_VERSION}"
          git tag -a -m "Bump version to ${NEW_VERSION}" "v${NEW_VERSION}"
          echo "new-version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Push version bump and tag
        env:
          CI_PAT: ${{ secrets.CI_PAT }}
        run: |
          # Checkout doesn't persist credentials
          AUTH=$(printf 'x-access-token:%s' "${CI_PAT}" | base64 -w0)
          echo "::add-mask::${AUTH}"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH}" push --follow-tags

      - name: Docker login
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB }}

      - name: Build and push Docker image
        working-directory: aws-lambda
        env:
          NEW_VERSION: ${{ steps.version.outputs.new-version }}
        run: |
          docker build -t "${IMAGE_NAME}:dev" .
          docker tag "${IMAGE_NAME}:dev" "floriday/${IMAGE_NAME}:dev"
          docker tag "${IMAGE_NAME}:dev" "floriday/${IMAGE_NAME}:${NEW_VERSION}"
          docker push "floriday/${IMAGE_NAME}:dev"
          docker push "floriday/${IMAGE_NAME}:${NEW_VERSION}"

      - name: Publish npm package
        working-directory: typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.version.outputs.new-version }}
        run: |
          gh release create "v${NEW_VERSION}" \
            --verify-tag \
            --title "v${NEW_VERSION}" \
            --notes "npm package: https://www.npmjs.com/package/databricks-cdk/v/${NEW_VERSION}"
