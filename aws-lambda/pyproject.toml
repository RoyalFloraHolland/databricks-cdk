[tool.poetry]
name = "databricks-cdk"
version = "0.11.36"
description = "Deploying databricks resources from cdk"
authors = ["The Data Science Team <teamdatascience@royalfloraholland.com>"]

keywords = ["databricks", "cdk", "aws"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/RoyalFloraHolland/databricks-cdk"
repository = "https://github.com/RoyalFloraHolland/databricks-cdk"
include = ["LICENSE"]


packages = [{ include = "databricks_cdk", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
pydantic = "^1.4.0"
requests = ">=2.22"
boto3 = "^1.21.10"
cfnresponse = "^1.1.2"
tenacity = "^8.2.2"
databricks-sdk = "^0.13.0"

[tool.poetry.group.dev.dependencies]
coverage = { version = "^7.6", extras = ["toml"] }
pytest = "^8.3"
pytest-mock = "^3.14"
pyproject-flake8 = "^7.0"
isort = "^5.13"
black = "^24.8"
pytest-cov = "^5.0"
mypy = "^1.11"

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.pytest.ini_options]
addopts = "--junitxml=junit/report.xml"
testpaths = ["tests"]
markers = "requires_database: requires postgresql"

[tool.coverage.report]
omit = ["tests/*", ".venv/*"]
precision = 2
show_missing = true

[tool.coverage.run]
command_line = "-m pytest -v tests/"
omit = ["tests/*", ".venv/*"]

[tool.flake8]
max-line-length = 180
extend-exclude = ["deploy", ".venv"]
extend-ignore = "E203"

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
files = "src/"
python_version = "3.12"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
