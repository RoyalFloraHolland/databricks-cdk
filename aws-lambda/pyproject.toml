[project]
name = "databricks-cdk"
version = "0.11.38"
description = "Deploying databricks resources from cdk"
authors = [{ name = "The Data Science & AI Team", email = "teamdatascience@royalfloraholland.com" }]
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = "MIT"
keywords = [
    "databricks",
    "cdk",
    "aws",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=1.4.0,<2",
    "requests>=2.22",
    "boto3>=1.21.10,<2",
    "cfnresponse>=1.1.2,<2",
    "tenacity>=8.2.2,<9",
    "databricks-sdk>=0.13.0,<0.14",
]

[project.urls]
Homepage = "https://github.com/RoyalFloraHolland/databricks-cdk"
Repository = "https://github.com/RoyalFloraHolland/databricks-cdk"
"npm package" = "https://www.npmjs.com/package/databricks-cdk"
"Docker image" = "https://hub.docker.com/r/floriday/databricks-cdk-lambda"

[dependency-groups]
dev = [
    "coverage[toml]>=7.6,<8",
    "pytest>=8.3,<9",
    "pytest-mock>=3.14,<4",
    "pytest-cov>=5.0,<6",
    { include-group = "dev-tools" },
]
dev-tools = [
    "pyproject-flake8>=7.0,<8",
    "isort>=5.13,<6",
    "black>=24.8,<25",
    "mypy>=1.11,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/databricks_cdk"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.pytest.ini_options]
addopts = "--junitxml=junit/report.xml"
testpaths = ["tests"]
markers = "requires_database: requires postgresql"

[tool.coverage.report]
omit = ["tests/*", ".venv/*"]
precision = 2
show_missing = true

[tool.coverage.run]
command_line = "-m pytest -v tests/"
omit = ["tests/*", ".venv/*"]

[tool.flake8]
max-line-length = 180
extend-exclude = ["deploy", ".venv"]
extend-ignore = "E203"

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
files = "src/"
python_version = "3.12"
